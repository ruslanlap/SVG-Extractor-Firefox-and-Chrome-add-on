<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG Extractor Pro</title>
  <style>
    @font-face {
      font-family: "Onest";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/onest-cyrillic.woff2") format("woff2");
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: "Onest";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/onest-latin-ext.woff2") format("woff2");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: "Onest";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("fonts/onest-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 100 800;
      font-display: swap;
      src: url("fonts/jetbrains-mono-cyrillic.woff2") format("woff2");
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: "JetBrains Mono";
      font-style: normal;
      font-weight: 100 800;
      font-display: swap;
      src: url("fonts/jetbrains-mono-latin.woff2") format("woff2");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --font-sans: "Onest", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --background: 40 23% 97%;
      --foreground: 228 18% 9%;
      --card: 0 0% 100%;
      --primary: 254 65% 54%;
      --primary-foreground: 0 0% 100%;
      --muted: 40 16% 93%;
      --muted-foreground: 225 10% 40%;
      --emerald: 158 64% 40%;
      --border: 40 14% 87%;
      --grid-line: rgba(19, 21, 27, 0.055);
    }

    .dark {
      --background: 228 14% 5%;
      --foreground: 220 20% 96%;
      --card: 225 14% 8%;
      --primary: 252 86% 77%;
      --primary-foreground: 228 24% 8%;
      --muted: 225 13% 12%;
      --muted-foreground: 220 9% 62%;
      --emerald: 158 64% 52%;
      --border: 225 12% 16%;
      --grid-line: rgba(242, 244, 248, 0.045);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-color: hsl(var(--border));
    }

    [hidden] { display: none !important; }

    body {
      font-family: var(--font-sans);
      width: 390px;
      max-height: 580px;
      overflow-y: auto;
      background-color: hsl(var(--background));
      color: hsl(var(--foreground));
      -webkit-font-smoothing: antialiased;
    }

    .popup-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 0.75rem 1rem;
      background-color: hsl(var(--background) / 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid hsl(var(--border));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }

    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      box-shadow: 0 0 0 1px hsl(var(--border));
    }

    .brand h1 {
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .lang-switcher {
      display: inline-flex;
      padding: 2px;
      border-radius: 8px;
      background-color: hsl(var(--muted));
      border: 1px solid hsl(var(--border));
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 0.22rem 0.42rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      color: hsl(var(--muted-foreground));
      cursor: pointer;
    }

    .lang-btn.is-active {
      background-color: hsl(var(--card));
      color: hsl(var(--foreground));
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 1px solid hsl(var(--border));
      background-color: hsl(var(--card));
      color: hsl(var(--muted-foreground));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      background-color: hsl(var(--muted));
      color: hsl(var(--foreground));
    }

    .popup-summary {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid hsl(var(--border));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background-color: hsl(var(--card) / 0.5);
    }

    .summary-count {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.75rem;
      color: hsl(var(--muted-foreground));
    }

    .studio-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      height: 30px;
      padding: 0 0.7rem;
      border-radius: 8px;
      border: 1px solid hsl(var(--border));
      background-color: hsl(var(--foreground));
      color: hsl(var(--background));
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
    }

    .studio-btn:hover {
      opacity: 0.9;
    }

    .popup-body {
      padding: 0.875rem 1rem 1rem;
    }

    #content {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.875rem;
    }

    .svg-item {
      border: 1px solid hsl(var(--border));
      border-radius: 14px;
      background-color: hsl(var(--card));
      overflow: hidden;
    }

    .card-topbar {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid hsl(var(--border));
      background-color: hsl(var(--muted) / 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .svg-name {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .type-badge {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      font-weight: 600;
      padding: 0.12rem 0.38rem;
      border-radius: 5px;
      text-transform: uppercase;
      background-color: hsl(var(--primary) / 0.12);
      color: hsl(var(--primary));
      border: 1px solid hsl(var(--primary) / 0.25);
      flex-shrink: 0;
    }

    .svg-preview {
      height: 132px;
      padding: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: hsl(var(--background));
      background-image:
        linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .svg-preview svg,
    .svg-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .svg-meta {
      padding: 0.45rem 0.75rem;
      border-top: 1px solid hsl(var(--border));
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.6875rem;
      color: hsl(var(--muted-foreground));
      display: flex;
      justify-content: space-between;
    }

    .svg-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.4rem;
      padding: 0.6rem 0.75rem;
      border-top: 1px solid hsl(var(--border));
    }

    .card-btn {
      height: 30px;
      border-radius: 8px;
      border: 1px solid hsl(var(--border));
      background-color: hsl(var(--muted) / 0.5);
      color: hsl(var(--foreground));
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      cursor: pointer;
    }

    .card-btn:hover {
      background-color: hsl(var(--muted));
    }

    .card-btn-primary {
      background-color: hsl(var(--primary));
      border-color: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
    }

    .card-btn-primary:hover {
      background-color: hsl(var(--primary));
      opacity: 0.92;
    }

    .state-box {
      padding: 2rem 1rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      color: hsl(var(--muted-foreground));
      font-size: 0.875rem;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid hsl(var(--border));
      border-top-color: hsl(var(--primary));
      border-radius: 9999px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header class="popup-header">
    <div class="brand">
      <img src="icons/icon48.png" alt="SVG Extractor Pro" />
      <h1 id="page-title">SVG Extractor Pro</h1>
    </div>
    <div class="controls">
      <div class="lang-switcher" role="group" aria-label="Language switcher">
        <button type="button" id="lang-toggle-en" class="lang-btn is-active" aria-pressed="true">EN</button>
        <button type="button" id="lang-toggle-uk" class="lang-btn" aria-pressed="false">UA</button>
      </div>
      <button type="button" id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg id="theme-icon-light" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2m-7.07-15.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2m-15.07 7.07 1.41-1.41m11.32-11.32 1.41-1.41"></path>
        </svg>
        <svg id="theme-icon-dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden aria-hidden="true">
          <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path>
        </svg>
      </button>
    </div>
  </header>

  <div class="popup-summary" id="popup-summary" hidden>
    <span class="summary-count" id="summary-count">0 vectors</span>
    <button type="button" id="open-studio-btn" class="studio-btn">Open Studio</button>
  </div>

  <main class="popup-body">
    <div id="loading" class="state-box">
      <div class="spinner"></div>
      <span id="loading-text">Searching for SVGs on the page...</span>
    </div>

    <div id="no-svg" class="state-box" hidden>
      <span id="no-svg-text">No SVG images found on this page.</span>
    </div>

    <div id="content" hidden></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
